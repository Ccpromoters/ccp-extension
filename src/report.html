<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Job Application Report</title>
  <style>
    :root { --line: #d9dee5; --muted: #5f6b78; --brand: #1c3b66; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1b2430; margin: 0; padding: 32px 40px; max-width: 900px; }
    header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid var(--brand); padding-bottom: 10px; margin-bottom: 18px; }
    h1 { font-size: 22px; margin: 0; color: var(--brand); }
    h2 { font-size: 15px; margin: 24px 0 8px; }
    .muted { color: var(--muted); font-size: 13px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    .tile b { font-size: 24px; display: block; }
    .tile span { color: var(--muted); font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: #f4f6f9; font-weight: 600; }
    .controls { margin-bottom: 16px; display: flex; gap: 8px; align-items: center; }
    button, select { font: inherit; padding: 6px 10px; }
    footer { margin-top: 30px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
    @media print { .controls { display: none; } body { padding: 0; } }
  </style>
</head>
<body>
  <div class="controls">
    <label>Period <select id="days"><option value="7">Last 7 days</option><option value="14">Last 14 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option></select></label>
    <button id="btnPrint">Print / Save as PDF</button>
  </div>
  <header>
    <div><h1>Job Application Report</h1><div class="muted" id="sub"></div></div>
    <div class="muted" id="gen"></div>
  </header>
  <div class="tiles" id="tiles"></div>
  <h2>Applications by day</h2>
  <table id="byDay"></table>
  <h2>All applications</h2>
  <table id="all"></table>
  <h2>Recruiter activity</h2>
  <table id="recruiters"></table>
  <footer>Generated by CCP Extension from this browser profile's history, Gmail and the job boards' own records. Counts are only as complete as the scans that were run.</footer>
  <script type="module" src="report.js"></script>
</body>
</html>
