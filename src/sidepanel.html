<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCP Extension</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="top">
    <img src="../icons/icon32.png" alt="" width="28" height="28">
    <div class="grow">
      <div class="brand">CCP Extension</div>
      <div id="who" class="muted small">No candidate set yet</div>
    </div>
    <button id="btnSettings" class="icon" title="Settings">&#9881;</button>
  </header>

  <nav class="tabs" role="tablist">
    <button data-tab="home" class="active">Home</button>
    <button data-tab="jobs">Jobs <span id="jobsCount" class="count"></span></button>
    <button data-tab="inbox">Inbox <span id="inboxCount" class="count"></span></button>
    <button data-tab="resume">Resume</button>
  </nav>

  <main>
    <section id="tab-home" class="tab active">
      <div class="stats">
        <div class="stat"><b id="stApplied">0</b><span>Applied · 7d</span></div>
        <div class="stat"><b id="stViewed">0</b><span>Viewed · 7d</span></div>
        <div class="stat"><b id="stRecruiters">0</b><span>Recruiters · 7d</span></div>
        <div class="stat"><b id="stInterviews">0</b><span>Interviews · 7d</span></div>
      </div>
      <div class="actions">
        <button id="btnOpen" class="primary">Open job boards</button>
        <button id="btnScanAll">Scan history + Gmail</button>
        <button id="btnScanApplied">Read board "Applied" lists</button>
        <button id="btnReport">Weekly report</button>
      </div>
      <div id="progress" class="progress hidden"></div>
      <div id="lastScan" class="muted small"></div>
      <h3>Recent applications</h3>
      <div id="homeRecent" class="list"></div>
      <h3>Latest recruiter mail</h3>
      <div id="homeMail" class="list"></div>
    </section>

    <section id="tab-jobs" class="tab">
      <div class="filters">
        <select id="jobStatus">
          <option value="">All statuses</option>
          <option value="applied">Applied</option>
          <option value="likely">Likely applied</option>
          <option value="viewed">Viewed only</option>
        </select>
        <select id="jobRange">
          <option value="7">7 days</option>
          <option value="30" selected>30 days</option>
          <option value="90">90 days</option>
          <option value="0">All time</option>
        </select>
        <input id="jobSearch" type="search" placeholder="Search title / company">
        <button id="btnCsv" class="small" title="Export CSV">CSV</button>
      </div>
      <div id="jobList" class="list"></div>
    </section>

    <section id="tab-inbox" class="tab">
      <div id="mailKinds" class="chips"></div>
      <div id="mailList" class="list"></div>
    </section>

    <section id="tab-resume" class="tab">
      <div class="field">
        <label for="resumeSelect">Master resume</label>
        <select id="resumeSelect"></select>
        <div id="resumeHint" class="muted small"></div>
      </div>
      <div class="field">
        <label for="jdText">Job description</label>
        <div class="row">
          <button id="btnUseTab" class="small">Use current tab</button>
          <span id="jdMeta" class="muted small grow"></span>
        </div>
        <textarea id="jdText" rows="8" placeholder="Paste the full job description here, or open a job posting and click “Use current tab”."></textarea>
        <div class="row">
          <input id="jobTitle" placeholder="Job title">
          <input id="jobCompany" placeholder="Company">
        </div>
      </div>
      <details class="field">
        <summary>Terms the candidate has confirmed (optional)</summary>
        <input id="overrides" placeholder="e.g. Veeam, vCenter — only what the candidate confirmed">
      </details>
      <button id="btnTailor" class="primary">Tailor resume to this JD</button>
      <div id="tailorProgress" class="progress hidden"></div>
      <div id="tailorResult"></div>
      <details id="marketGap" class="field">
        <summary>Skills gap vs. the jobs you viewed</summary>
        <div id="marketGapBody" class="small"></div>
      </details>
    </section>
  </main>

  <footer id="status" class="status" aria-live="polite"></footer>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
